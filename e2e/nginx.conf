server {
    listen 80;
    server_name localhost;

    # ── Auth endpoints: proxy directly to gateway ──
    location /auth/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # ── Gateway health/ready ──
    location /health {
        proxy_pass http://gateway:8080;
    }
    location /ready {
        proxy_pass http://gateway:8080;
    }

    # ── Internal auth subrequest ──
    location = /_auth {
        internal;
        proxy_pass http://gateway:8080/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # ── Everything else: auth_request then proxy to template-ui ──
    location / {
        auth_request /_auth;

        # Capture auth headers from gateway response
        auth_request_set $auth_email   $upstream_http_x_auth_user_email;
        auth_request_set $auth_name    $upstream_http_x_auth_user_name;
        auth_request_set $auth_sub     $upstream_http_x_auth_user_sub;
        auth_request_set $auth_token   $upstream_http_x_auth_access_token;

        # Forward identity headers to template-ui
        proxy_set_header X-Auth-User-Email   $auth_email;
        proxy_set_header X-Auth-User-Name    $auth_name;
        proxy_set_header X-Auth-User-Sub     $auth_sub;
        proxy_set_header X-Auth-Access-Token $auth_token;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # SSE support
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        proxy_pass http://template-ui:5003;

        # On auth failure, return 401 so frontend JS can show the modal
        error_page 401 = @auth_failed;
    }

    location @auth_failed {
        default_type application/json;
        return 401 '{"error":"session_expired","message":"Authentication required"}';
    }
}
