server {
    listen 80;
    server_name localhost;

    # ── Auth endpoints: proxy directly to gateway ──
    location /auth/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # ── Login redirect (gateway handles SSO redirect) ──
    location /login {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # ── Gateway health/ready ──
    location /health {
        proxy_pass http://gateway:8080;
    }
    location /ready {
        proxy_pass http://gateway:8080;
    }

    # ── Internal auth subrequest ──
    location = /_auth {
        internal;
        proxy_pass http://gateway:8080/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # ── API routes: auth_request then proxy to template-ui BFF ──
    location /api/ {
        auth_request /_auth;

        auth_request_set $auth_email   $upstream_http_x_auth_user_email;
        auth_request_set $auth_name    $upstream_http_x_auth_user_name;
        auth_request_set $auth_sub     $upstream_http_x_auth_user_sub;
        auth_request_set $auth_token   $upstream_http_x_auth_access_token;

        proxy_set_header X-Auth-User-Email   $auth_email;
        proxy_set_header X-Auth-User-Name    $auth_name;
        proxy_set_header X-Auth-User-Sub     $auth_sub;
        proxy_set_header X-Auth-Access-Token $auth_token;

        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # SSE support
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        proxy_pass http://template-ui:5003;

        error_page 401 = @auth_redirect;
    }

    # ── UI: gateway serves static files + SPA catch-all ──
    location / {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location @auth_redirect {
        return 302 http://$http_host/auth/login?redirect=$request_uri;
    }
}
